{% extends 'base.html' %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded shadow">
    <h2 class="text-2xl font-bold text-primary mb-4">Acceso Administrativo</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-sm font-medium">Usuario</label>
            <input type="text" name="username" class="w-full p-2 border rounded">
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium">Contraseña</label>
            <input type="password" name="password" class="w-full p-2 border rounded">
        </div>
        <button type="submit" class="bg-primary text-white px-6 py-2 rounded hover:bg-blue-900 w-full">Ingresar</button>
    </form>
</div>
{% endblock %}
