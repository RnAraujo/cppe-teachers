server {
        listen 80;
        server_name peruano365.org.pe;

        root /var/www/html;
}

server {
        listen 443 ssl;
        server_name peruano365.org.pe;

        client_max_body_size 20M;

        ssl_certificate /etc/letsencrypt/live/peruano365.org.pe/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/peruano365.org.pe/privkey.pem;

        location /static/ {
                alias /var/www/staticfiles/;
                autoindex off;
                expires 3M;
                access_log off;
        }

        location /media/ {
                alias /var/www/media/;
                autoindex off;
                expires 4w;
        }

        location /favicon.ico {
                alias /var/www/staticfiles/favicon.ico;
                expires 6M;
                access_log off;
        }

        location / {
                include uwsgi_params;
                uwsgi_pass unix:/run/uwsgi/courses.sock;

                uwsgi_param Host $host;
                uwsgi_param X-Real-IP $remote_addr;
                uwsgi_param X-Forwarded-For $proxy_add_x_forwarded_for;
                uwsgi_param X-Forwarded-Proto https;
                # proxy_set_header X-Real-IP $remote_addr;
                # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        access_log /var/log/nginx/peruano365_access.log;
        error_log /var/log/nginx/peruano365_error.log warn;
}
